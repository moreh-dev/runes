[tasks.claude-install-skills]
run = [
    "claude plugin marketplace add moreh-dev/runes",
    "claude plugin install runes@moreh-dev",
]

[tasks.claude-update-skills]
run = [
    "claude plugin marketplace update moreh-dev",
    "claude plugin update runes@moreh-dev",
]

[tasks.codex-install-skills]
run = [
    "codex plugin marketplace add moreh-dev/runes",
    "codex plugin add runes@moreh-dev",
]

[tasks.codex-update-skills]
run = [
    "codex plugin marketplace upgrade moreh-dev",
    "codex plugin add runes@moreh-dev",
]

[tasks.check-skills-sync]
run = [
    "scripts/check-skills-sync.sh",
]
